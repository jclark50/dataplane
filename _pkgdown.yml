url: https://jclark50.github.io/dataplane/

template:
  bootstrap: 5

home:
  title: dataplane
  description: "Data architecture and processing helpers with repeatable metadata workflows."

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/jclark50/dataplane
      aria-label: GitHub repository

reference:
  - title: Parquet + metadata I/O
    contents:
      # Any current/future write/read helpers (robust to renames that keep prefixes)
      - starts_with("write_")
      - starts_with("read_")
      - open_dataset
      - detect
      # If your dataset metadata helpers don't use read_/write_ prefixes, keep them explicit:
      - write_dataset_meta
      - read_dataset_meta

  - title: Specs, units, scaling
    contents:
      # Core spec object and helpers
      - dp_spec
      - spec_default
      - starts_with("set_")
      - ends_with("_units")
      - starts_with("scale_")
      - unit
      - "unit<-"

  - title: Utilities
    contents:
      - merge_dt_list
      - flatten_list_columns
      - filter_cols
      - drop_null
      - round_cols
      - trim_all_cols
      - to_camel_case
      - timed
      - require_ram
      - mavtime
      - rep_var
      # Keep these explicit if you want them shown even if you later rename:
      - cbind_list
      - collapse
      - sanitize_value
      - stop_cluster

articles:
  - title: Vignettes
    contents:
      - dataplane-parquet-metadata
