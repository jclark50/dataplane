url: https://jclark50.github.io/dataplane/

template:
  bootstrap: 5

home:
  title: dataplane
  description: "Data architecture and processing helpers with repeatable metadata workflows."

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/jclark50/dataplane
      aria-label: GitHub repository

reference:
  - title: Dataplane I/O + metadata
    contents:
      - starts_with("dp_read")
      - starts_with("dp_write")
      - dp_open
      - dp_detect
      - dp_print_detect

  - title: Specs, units, scaling
    contents:
      - dp_spec
      - dp_spec_default
      - dp_set_units
      - dp_set_scale
      - dp_tag_units
      - dp_check_units
      - dp_scale_encode
      - dp_scale_decode

  - title: GeoParquet helpers
    contents:
      - starts_with("gp_geoparquet_")

  - title: Small utilities
    contents:
      - "%||%"

articles:
  - title: Vignettes
    contents:
      - dataplane-parquet-metadata
